spring:
  application:
    name: clientes-api
  datasource:
    url: jdbc:h2:mem:clientes;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
server:
  error:
    include-message: never
logging:
  level:
    br.com.lucenfort: INFO
