<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Clientes API - Spring Boot</title>
  <desc id="desc">Banner animado do projeto Clientes API com integracao ViaCEP</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#102a43"/>
      <stop offset="1" stop-color="#0b4f4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#9bd6d0" stroke-opacity=".08"/>
    </pattern>
    <style>
      .title { font: 700 52px 'Segoe UI', sans-serif; letter-spacing: 1px; fill: #f8fafc; }
      .subtitle { font: 400 20px 'Segoe UI', sans-serif; letter-spacing: 3px; fill: #a7f3d0; }
      .label { font: 600 14px 'Segoe UI', sans-serif; letter-spacing: 1px; fill: #bae6fd; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1050" cy="40" r="180" fill="#22d3ee" fill-opacity=".08">
    <animate attributeName="r" values="160;190;160" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".4;.8;.4" dur="6s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(82 78)">
    <rect x="0" y="0" width="116" height="116" rx="28" fill="#0f766e" fill-opacity=".7" stroke="#6ee7b7" stroke-width="2"/>
    <path d="M31 53 58 38l27 15v31L58 99 31 84Z" fill="none" stroke="#ecfeff" stroke-width="6" stroke-linejoin="round"/>
    <path d="m31 53 27 16 27-16M58 69v30" fill="none" stroke="#6ee7b7" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="58" cy="69" r="10" fill="#38bdf8">
      <animate attributeName="r" values="7;11;7" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="238" y="126" class="title">Clientes API</text>
  <text x="242" y="166" class="subtitle">SPRING BOOT  •  JPA  •  VIACEP</text>
  <rect x="242" y="202" width="300" height="3" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="80;300;80" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="242" y="250" class="label">CRUD seguro para cadastro de clientes e enderecos</text>
  <text x="242" y="278" class="label">H2 / PostgreSQL  •  REST  •  JUnit</text>

  <g transform="translate(820 225)" fill="none" stroke="url(#accent)" stroke-width="3">
    <path d="M0 0h110" stroke-linecap="round">
      <animate attributeName="stroke-dasharray" values="0 110;110 0" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M110 0 92-12M110 0 92 12"/>
    <circle cx="0" cy="0" r="7" fill="#6ee7b7">
      <animate attributeName="cy" values="0;-18;0" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
